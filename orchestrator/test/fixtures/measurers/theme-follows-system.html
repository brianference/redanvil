<!doctype html>
<!--
  The positive control: identical page, except the default consults the system.
  cold_visitor must PASS this one. Without it, a check that always fails would
  look just as good as a check that works.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Theme follows the system</title>
    <meta name="description" content="Fixture: default theme follows the OS." />
    <style>
      :root[data-theme='light'] { --bg: #ffffff; --fg: #111418; }
      :root[data-theme='dark']  { --bg: #070b14; --fg: #e8eef8; }
      body { background: var(--bg); color: var(--fg); font-size: 16px; margin: 0; padding: 24px; }
    </style>
  </head>
  <body>
    <h1>Fixture</h1>
    <p>The default follows prefers-color-scheme; a stored choice would win.</p>
    <button id="t" type="button" aria-label="Toggle theme">Toggle theme</button>
    <script>
      const stored = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute(
        'data-theme',
        stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light'
      );
      document.getElementById('t').addEventListener('click', () => {
        const next =
          document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      });
    </script>
  </body>
</html>
