<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Brand asset verify — AZ Planting Calendar</title>
<style>
  body { margin:0; font-family: system-ui,sans-serif; background:#0b0b0f; color:#e8e8ec; padding:24px; }
  h1 { font-size:1.25rem; margin:0 0 8px; }
  p { color:#a0a0ab; max-width:60ch; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:20px; margin-top:24px; }
  figure { margin:0; background:#16161c; border:1px solid #2a2a34; border-radius:8px; padding:16px; }
  figcaption { margin-top:10px; font-size:0.9rem; color:#c4c4ce; }
  img { max-width:100%; height:auto; display:block; image-rendering:auto; background:repeating-conic-gradient(#ccc 0% 25%, #fff 0% 50%) 50% / 16px 16px; }
  img.pixel { image-rendering: pixelated; width:128px; height:128px; }
</style>
</head>
<body>
  <h1>Brand asset verification</h1>
  <p>Approved mark wired; favicon is a separate cactus silhouette (not a downscale). Open each tile and check legibility.</p>
  <div class="grid">
    <figure><img src="favicon-32.png" class="pixel" width="128" height="128" alt="favicon 32"/><figcaption>1. favicon-32.png (native 32px, shown 4× nearest)</figcaption></figure>
    <figure><img src="favicon-32-4x.png" alt="favicon 4x"/><figcaption>2. favicon-32-4x.png — cactus arms must read</figcaption></figure>
    <figure><img src="favicon-32-on-white-enlarged.png" alt="favicon on white"/><figcaption>3. favicon on white</figcaption></figure>
    <figure><img src="favicon-32-on-dark-enlarged.png" alt="favicon on dark"/><figcaption>4. favicon on dark</figcaption></figure>
    <figure><img src="brand-on-dark.png" alt="brand dark"/><figcaption>5. brand-mark on dark</figcaption></figure>
    <figure><img src="brand-on-light.png" alt="brand light"/><figcaption>6. brand-mark on light</figcaption></figure>
    <figure><img src="mark-transparent-full.png" alt="transparent full"/><figcaption>7. transparent full mark</figcaption></figure>
  </div>
</body>
</html>
