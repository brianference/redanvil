<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pet Sitter Finder</title>
    <meta
      name="description"
      content="Find and book trusted local pet sitters: browse by neighbourhood with verified reviews, per-night rates, pet types, and real availability."
    />
    <link rel="canonical" href="https://pet-sitter-vz1.pages.dev/" />
    <meta property="og:title" content="Pet Sitter Finder" />
    <meta property="og:type" content="website" />
    <meta
      property="og:description"
      content="Browse local pet sitters by neighbourhood, rates, pet types, and reviews."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:url" content="https://pet-sitter-vz1.pages.dev/" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/brand-mark.png" />
    <!-- Apply theme before first paint: stored choice wins, else OS preference. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var choice =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', choice);
        } catch (e) {
          try {
            document.documentElement.setAttribute(
              'data-theme',
              window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
            );
          } catch (e2) {
            /* ignore */
          }
        }
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Pet Sitter Finder",
        "description": "Marketplace to find and book trusted local pet sitters by neighbourhood, rates, pet types, and reviews.",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Web",
        "url": "https://pet-sitter-vz1.pages.dev/",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "CAD"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
