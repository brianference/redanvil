name: Drift re-gate

# The scheduled outer loop from docs/claude-primitives-integration.md: the ralph
# loop converges once and nothing re-checks production afterward. This re-runs the
# real audits against the LIVE site on a cadence and fails (surfacing an alert) on
# any regression — the contrast regression and the wizard 400 this project shipped
# would each have been caught here the next day instead of by a user.

on:
  schedule:
    # 14:00 UTC daily. GitHub Actions has real internet egress; a local cron does not.
    - cron: '0 14 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Verdict freshness is checked against the commit each review was
          # recorded at, and the default shallow clone cannot resolve any of
          # them. Without this the re-gate below reports every verdict stale.
          fetch-depth: 0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
      - run: npm ci
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # Accessibility + contrast on both surfaces, both themes. axe-core, not a
      # hand-rolled measurement (base rule 16).
      - name: axe — app-builder (dark)
        run: node .github/scripts/a11y_audit.mjs https://redanvil.pages.dev/ --theme dark
      - name: axe — app-builder (light)
        run: node .github/scripts/a11y_audit.mjs https://redanvil.pages.dev/ --theme light
      - name: axe — dashboard (dark)
        run: node .github/scripts/a11y_audit.mjs https://redanvil-dashboard.pages.dev/ --theme dark
      - name: axe — dashboard (light)
        run: node .github/scripts/a11y_audit.mjs https://redanvil-dashboard.pages.dev/ --theme light

      # The core flow must still work end to end (chat -> wizard -> Forge PRD).
      - name: E2E smoke — core flow
        run: node .github/scripts/e2e_smoke.mjs https://redanvil.pages.dev/ --trace e2e-drift.zip

      # The twelve design rules that used to rest on a prose note. Measuring
      # them daily is what stops the number and the claim drifting apart again.
      - name: Design audit — app-builder
        run: node .github/scripts/design_audit.mjs https://redanvil.pages.dev/ --out evidence/design-app-builder.json
      - name: Design audit — dashboard
        run: node .github/scripts/design_audit.mjs https://redanvil-dashboard.pages.dev/ --out evidence/design-dashboard.json
      - name: Desktop width — app-builder
        run: node .github/scripts/desktop_width.mjs https://redanvil.pages.dev/
      - name: Desktop width — dashboard
        run: node .github/scripts/desktop_width.mjs https://redanvil-dashboard.pages.dev/ --routes /,/about,/contact,/terms,/privacy

      # Re-run the GATE, not just the live audits. Verdict freshness only ever
      # fired when someone ran the gate by hand, so a recorded review could go
      # stale and stay stale indefinitely with nothing noticing. This is the
      # cadence behind that mechanism: it fails the moment a verdict stops
      # describing the code, or a committed result stops reproducing.
      # Root install only: both apps are npm workspaces (single hoisted react).
      - name: Re-gate app-builder against its committed result
        run: node .github/scripts/verify_results.mjs app-builder results/app-builder.json evidence/verdicts-app-builder.json ci,process
      - name: Re-gate dashboard against its committed result
        run: node .github/scripts/verify_results.mjs dashboard results/dashboard.json evidence/verdicts-dashboard.json ci,process

      # A green result and a stale production build must not coexist. Needs the
      # apps built so the scored bundle can be compared with what is served.
      - name: Build both apps
        run: npm run build --workspace app-builder && npm run build --workspace dashboard
      - name: Deployed build matches the scored commit — app-builder
        run: node .github/scripts/verify_deployed.mjs app-builder results/app-builder.json https://redanvil.pages.dev/
      - name: Deployed build matches the scored commit — dashboard
        run: node .github/scripts/verify_deployed.mjs dashboard results/dashboard.json https://redanvil-dashboard.pages.dev/

      # Keep the trace when something fails, so a drift is opened, not re-driven.
      - name: Upload e2e trace on failure
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: e2e-drift-trace
          path: e2e-drift.zip
          if-no-files-found: ignore
