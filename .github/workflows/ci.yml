name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
      # `npm test` now runs the pytest lane as well as vitest. Without an
      # interpreter and the two Python deps, run_pytest.mjs exits 1 by design —
      # "could not run the tests" must never read as "the tests passed" — so CI
      # has to actually provide them rather than let the lane be skipped.
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.13'
      - name: Install Python test deps
        run: python -m pip install -r orchestrator/python/requirements.txt
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # desktopWidth.test.ts renders fixture pages to prove the width check
      # measures painted content rather than a container. Without a browser the
      # script exits 2 and the test fails loudly rather than skipping, which is
      # the right direction — but the test is worth running, so install one.
      - name: Install Chromium for the rendered-fixture tests
        run: npx playwright install --with-deps chromium
      - run: npm test

  # Reproduces the committed gate result instead of trusting it. A results file
  # is just correctly-shaped JSON; the only way to tell a real score from a
  # hand-authored one is to run the gate again and compare rule-by-rule.
  results-provenance:
    runs-on: ubuntu-latest
    # This job reproduces TWO full gate runs, each driving Playwright, in one
    # runner. It killed the runner with "Out of memory" twice on 2026-08-12 --
    # once with no log at all, and once mid-way through the dashboard step after
    # the app-builder step had passed, which renders in `gh run view` as an X on
    # a step that actually succeeded. Capping the heap makes V8 collect rather
    # than grow until the runner is killed; without it the failure looks like a
    # verification regression and sends the next reader after the wrong thing.
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Full history: the gate checks each verdict against the commit it was
          # recorded at, and the default shallow clone has one commit, so every
          # reviewedCommit is unresolvable and all 24 verdicts drop as stale.
          # That reads as 24 design regressions when nothing changed at all.
          fetch-depth: 0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
      # One install at the root: app-builder and dashboard are npm workspaces
      # now, so react is hoisted to a single copy. Installing them separately
      # would recreate the two-React-instances bug that broke every hook.
      - name: Install workspace deps
        run: npm ci
      # Gate reproduction runs browser-backed rules (fe-result-in-viewport,
      # fe-search-present, fe-light-dark, …). Without Chromium those checks
      # crash or infra-fail instead of measuring, so the reproduced
      # notApplicable set and per-rule outcomes disagree with a real gate run
      # that had browsers. Install before verify (and reuse for e2e smoke below).
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Verify results were produced by the gate
        run: node .github/scripts/verify_results.mjs app-builder results/app-builder.json evidence/verdicts-app-builder.json process
      # The dashboard ships to production too. Gating only app-builder left half
      # the deployed surface with no measured score at all.
      - name: Verify dashboard results were produced by the gate
        run: node .github/scripts/verify_results.mjs dashboard results/dashboard.json evidence/verdicts-dashboard.json process
      # The dashboard fetches results/all.json directly, so the artifact the
      # public site displays must be derived from the verified per-run files
      # rather than hand-maintained alongside them.
      - name: Verify the dashboard feed is derived, not hand-edited
        run: node .github/scripts/build_feed.mjs --check
      - name: Verify design rules match the skill source
        run: node .github/scripts/verify_design_rules.mjs
      # The app gate waives the ci lane (generated apps have no workflows), so the
      # repo's own CI blockers are scored here instead of nowhere.
      - name: Gate the repo against its own CI-lane blockers
        run: node .github/scripts/gate_repo_ci.mjs
      # The product's core promise is that generated apps clear the gate. Unit
      # tests and a local probe covered the scaffold; no CI job ever took a
      # freshly generated app through the real checks. This does.
      - name: Gate a freshly scaffolded app
        run: node .github/scripts/gate_scaffold.mjs
      # End-to-end smoke of the core flow against production, driven by role with
      # web-first assertions (no fixed sleeps). Catches the chat -> wizard -> Forge
      # PRD path that shipped a 400. Best-effort: needs a browser (installed above).
      - name: E2E smoke against production
        run: node .github/scripts/e2e_smoke_app_builder.mjs https://redanvil.pages.dev/

  # The finish line cannot be bypassed with --no-verify. For every app listed in
  # .github/scripts/apps.mjs (the same APPS reverify / pre-push use): score >= 90,
  # zero failing rules, provenance commit is an ancestor of HEAD, and visual
  # evidence is not older than the commit it claims to review. Shipping an
  # unmeasured app FAILS here.
  apps-meet-the-bar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Full history so provenance ancestors and evidence-vs-commit ages resolve.
          fetch-depth: 0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
      - name: Install workspace deps
        run: npm ci
      - name: Every gated app meets the finish line
        run: node .github/scripts/meets_the_bar.mjs

  # sushi-finder's acceptance suite drives a real browser against a real Pages
  # serve, so it needs a server this repo's other lanes never start. It used to
  # be dragged into the orchestrator job by a root vitest glob of
  # `**/test/**/*.test.ts`, where it failed every run for five days -- and the
  # error it produced named a browser-lifecycle fault rather than the missing
  # server, so the true cause never surfaced. The root config is scoped to the
  # orchestrator now; this is the lane that actually runs the suite.
  sushi-finder-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
      # sushi-finder is a root npm workspace as of 2026-08-10, so it installs
      # from the root lockfile and has none of its own. It was made one so react
      # hoists to a single copy and the shared design-system hooks are safe to
      # import; a per-app `npm ci` here now fails outright with no lockfile.
      - name: Install workspace deps
        run: npm ci
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: sushi-finder
      # The suite reads real rows through /api/sushis, so the local D1 has to be
      # migrated and seeded before the server starts or every list assertion
      # measures an empty database.
      - name: Apply D1 migrations to the local database
        run: npm run db:migrate:local
        working-directory: sushi-finder
      - name: Build
        run: npm run build
        working-directory: sushi-finder
      # Wait on a real readiness signal (/api/health answering 200), never a
      # fixed sleep: a sleep that is too short reports the app broken and a
      # sleep that is long enough is mostly wasted. Fails the job if the server
      # never comes up, rather than letting the suite discover it as 23 confusing
      # navigation errors.
      - name: Start the Pages preview and wait for it
        working-directory: sushi-finder
        run: |
          # nohup + disown so the server outlives this step's shell; each step
          # is its own process, and a plain `&` child can take the SIGHUP.
          nohup npm run preview > preview.log 2>&1 &
          disown
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8788/api/health; then
              echo "preview ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "preview never became ready; last 40 log lines:"; tail -40 preview.log; exit 1
      # No silent caps. assistant.test.ts is the one spec this lane cannot run:
      # /api/assistant is backed by the Workers AI binding, which wrangler
      # connects to the real Cloudflare account even in local dev, so it needs
      # credentials this repo does not hold. Saying so on every run keeps an
      # uncovered spec from reading as a covered one. Everything else runs, and
      # any NEW spec is included automatically -- only this one file is excluded.
      - name: Declare what this lane does not cover
        # Single-quoted: a plain YAML scalar cannot contain ": ", and an
        # unquoted `echo "NOT COVERED HERE: ..."` made the whole workflow
        # unparseable — GitHub failed the run in 0s before any job started.
        run: 'echo "NOT COVERED HERE: test/acceptance/assistant.test.ts (needs Workers AI credentials)"'
      - name: Acceptance tests
        working-directory: sushi-finder
        run: npx vitest run --config vitest.acceptance.config.ts --exclude node_modules --exclude dist --exclude 'test/acceptance/assistant.test.ts'

  # Note: linting is NOT repeated here. The root `npm run lint` in the
  # orchestrator job runs `eslint .` over the whole repo, which already covers
  # every file in both apps.
  apps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [app-builder, dashboard]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
      # Workspace install at the root; see the note in results-provenance.
      - name: Install workspace deps
        run: npm ci
      - name: Typecheck
        working-directory: ${{ matrix.app }}
        run: npx tsc --noEmit
      - name: Test
        working-directory: ${{ matrix.app }}
        run: npx vitest run
      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build

  # QuickFlight ships to production from its own repository, so its score has to
  # be re-verified the same way the other two are. Its artifacts live in that
  # repo rather than here, because provenance names quickflight commits and
  # freshness diffs quickflight paths -- a result stored here would claim a
  # commit from the wrong repository. So CI checks out both and verifies there.
  quickflight-provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out RedAnvil (the gate)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: redanvil
      - name: Check out QuickFlight (the app under review)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: brianference/quickflight
          # quickflight is a PRIVATE repo, and the default GITHUB_TOKEN is scoped
          # to this repository only -- the checkout failed with no other symptom
          # than "Check out QuickFlight" going red. This token is read-only-by-use
          # here: the job never pushes.
          token: ${{ secrets.QUICKFLIGHT_READ_TOKEN }}
          persist-credentials: false
          # Full history, for the same reason as above: a shallow clone makes
          # every reviewedCommit unresolvable and drops every verdict as stale.
          fetch-depth: 0
          path: quickflight
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
      - name: Install gate deps
        run: npm ci
        working-directory: redanvil
      - name: Install app deps
        run: npm ci
        working-directory: quickflight
      # The browser coverage pass has to run BEFORE verification, and this is not
      # optional here. QuickFlight's components and pages are measured only by
      # Playwright, so u-test-coverage-ratchet compares a number that includes
      # them. coverage-e2e/ is gitignored, so on a clean checkout it does not
      # exist -- and the merge step now refuses to publish a unit-only figure
      # under the same name rather than silently reporting a regression that did
      # not happen. Without this step CI reproduced 88 against a committed 92,
      # and the single differing rule was exactly that ratchet.
      # chromium AND webkit. The [mobile] project is built on
      # devices['iPhone 13'], whose defaultBrowserType is 'webkit', so a
      # chromium-only install fails 112 tests with "Executable doesn't exist"
      # rather than anything about the app. A project labelled "mobile" is not
      # necessarily the same engine as the desktop one.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
        working-directory: quickflight
      - name: Produce browser coverage
        run: npm run build:coverage && npx playwright test
        working-directory: quickflight
      - name: Verify QuickFlight results were produced by the gate
        run: node ../redanvil/.github/scripts/verify_results.mjs . results/quickflight.json evidence/verdicts-quickflight.json process
        working-directory: quickflight
